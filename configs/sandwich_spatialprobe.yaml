# =============================================================================
# SPATIAL-HEAD PROBE — warm-start the E4 SANDWICH record and train ONLY the
# saliency head S + the ROI editor M2 (the two mechanisms that have never been
# active in any recorded result).
#
# Evidence this is built on (all measured 2026-09-16, tools/ in vcm_deepseek):
#   * M2 dead saddle: zero-init output conv x zero-init gate => both gradients
#     exactly zero; every checkpoint has edit_strength == +0.000000 and
#     |W_editor_out| == 0.
#   * S head collapse: every checkpoint has W ~ 1e-8 (logits ~ -60), so M1's
#     gate (1-W) ~ 1 everywhere (global edit), M3's gate (1-W) ~ 1 (global
#     freeze) and M2 is gated off even when its init is repaired
#     (|W * edit| ~ 1e-12 -> gate gradient ~1e-14, below Adam's eps).
#   * With w_budget=0.25 AND a re-initialised S head, the same measurement gives
#     |g edit_strength| = 1.6e-6 -- 160x above Adam's eps and the same order as
#     the POST gate that DID open (-0.038) in the record run.
#   * Repairing the init alone is NOT enough (|g| = 1.7e-14): an earlier version
#     of this probe would have burned GPU hours and returned a null.
#
# Design: bounded probe. Everything except S and M2 is frozen, so the starting
# point is the E4 record with its W map replaced by a fresh, budget-normalised
# one. Cheap: ~46k trainable params.
#
# Warm-start: place the E4 checkpoint at
#   outputs/sandwich_spatialprobe/checkpoints/preprocessor.pth
# before launch (train.finetune=true loads it; reinit_prefixes then resets the
# saturated S head, _repair_dead_editor revives the editor).
#
# Pre-registered reading (docs/RUN_DESIGN_spatial.md):
#   * mechanism gates (must pass before any BD claim):
#       W mean within +/-20% of w_budget, W std > 0.05, |edit_strength| > 0.01
#     and the edited region must track the distill target (corr(W, target) > 0.3)
#   * if the BD improves on at least one codec at n=1159 with the gap rule PASS
#     -> the spatial head adds value; a full joint retrain from scratch is the
#     headline candidate
#   * if BD is flat or worse -> report it; the fallback is POST scaling to 4.6M,
#     which is the measured monotone lever.
# =============================================================================

device: auto
out_dir: outputs/sandwich_spatialprobe
seed: 0

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  arch: sandwich          # SandwichPreprocessor (src/models/sandwich.py)
  # --- PRE half (UP-VCM) ---
  s_ch: 16
  editor_ch: 24
  cond_dim: 1
  dino_weight: 0.5
  dino_name: dinov2_vits14
  motion_tau: 0.1
  gate: false
  # --- spatial head ---
  w_budget: 0.25          # fix mean(W) per clip: W keeps the CHOICE of where
                          # the budget goes, loses the option of spending none
  # --- POST half ---
  post_base: 64           # must match the E4 checkpoint (2.29M POST params)

codec:
  kind: virtual
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  colorspace: yuv420
  chroma_step_scale: 2.0
  step_coarse: 0.25
  step_fine: 0.03
  anneal: 1.0

data:
  index: data/index/kinetics_hash_split.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:
  lam_task: 1.0
  omega: 0.0
  beta: 0.001
  tau: 0.05
  delta: 0.0
  gamma: 0.0
  kappa: 10.0
  kappa_t: 0.0
  gamma_res: 0.0
  mu: 3.0                # pins post(codec(pre(x))) toward source pixels
  rho: 1.0               # S-head distillation -- the supervision that makes W
                         # a saliency map instead of a free parameter
  use_task_mask: true

train:
  epochs: 3
  max_steps: null
  reg_warmup_frac: 0.0
  batch_size: 8
  num_workers: 3
  lr: 3.0e-4             # fresh modules from a frozen backbone
  clip_grad: 1.0
  qp_list: [30, 35, 40, 45, 50]
  qp_to_quality: {30: 8, 35: 5, 40: 3, 45: 2, 50: 1}
  cosine: true
  patience: 2
  min_delta: 1.0e-4
  val_qp_mode: all
  val_max_batches: 5
  resume: false
  finetune: true                             # load the E4 record weights
  freeze_except: [s_net, editor, edit_strength]   # ONLY the spatial head trains
  reinit_prefixes: [s_net]                   # the trained head is saturated

eval:
  split: test
  include_proxy: false
  per_sequence: true
  batch_size: 4
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
