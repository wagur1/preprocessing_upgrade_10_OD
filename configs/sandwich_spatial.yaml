# =============================================================================
# STAGE 2 — retrain from scratch with the spatial head ACTIVE.
#
# Stage 1 (configs/sandwich_spatialprobe.yaml) froze everything and trained only
# the spatial head, which can RE-ALLOCATE the edit budget but not re-size it.
# Stage 2 removes that handbrake: 16 epochs from scratch, all parameters free,
# with `w_budget` keeping W from collapsing back to zero (measured: every
# pre-fix checkpoint has mean W ~ 1e-8, logits ~ -60, which turns M1 into a
# global edit and gates M2 off entirely).
#
# Single-variable A/B vs the E4 record recipe: the ONLY difference is
# `model.w_budget: 0.25` (same post_base 64, same loss weights, same schedule,
# seed 0, 16 epochs). Reference: outputs/eval_e4_full - h264 -5.71 / h265 -4.22
# at n=1159, same instrument.
#
# Pre-registered reading (docs/RUN_DESIGN_spatial.md section 4):
#   * gates: mean(W) within +/-20% of 0.25, std(W) > 0.05, |edit_strength| > 0.01,
#     corr(W, saliency_target) > 0.3
#   * win: BD better by >= 1 pp on at least one codec, gap rule PASS
#   * null: better by < 0.3 pp (inside the ~1 pp re-run noise)
#   * fallback if null: POST scaling (4.6M), the measured monotone lever
# =============================================================================

device: auto
out_dir: outputs/sandwich_spatial
seed: 0

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  arch: sandwich
  # --- PRE half (UP-VCM): E4 sizes, spatial head switched on ---
  s_ch: 16
  editor_ch: 24
  cond_dim: 1
  dino_weight: 0.5
  dino_name: dinov2_vits14
  motion_tau: 0.1
  gate: false
  w_budget: 0.25         # <- THE single change vs E4
  # --- POST half ---
  post_base: 64          # 2.3M, same as E4
  post_temporal: false

codec:
  kind: virtual
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  colorspace: yuv420
  chroma_step_scale: 2.0
  step_coarse: 0.25
  step_fine: 0.03
  anneal: 1.0

data:
  index: data/index/kinetics_hash_split.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:
  lam_task: 1.0
  omega: 0.0
  beta: 0.001
  tau: 0.05
  delta: 0.0
  gamma: 0.0
  kappa: 10.0
  kappa_t: 0.0
  gamma_res: 0.0
  mu: 3.0
  rho: 1.0
  use_task_mask: true

train:
  epochs: 16
  max_steps: null
  reg_warmup_frac: 0.0
  batch_size: 8
  num_workers: 3
  lr: 1.0e-4
  clip_grad: 1.0
  qp_list: [30, 35, 40, 45, 50]
  qp_to_quality: {30: 8, 35: 5, 40: 3, 45: 2, 50: 1}
  cosine: true
  patience: 4
  min_delta: 1.0e-4
  val_qp_mode: all
  val_max_batches: 5
  resume: true           # survives the 12h session cap
  finetune: false

eval:
  split: test
  include_proxy: false
  per_sequence: true
  batch_size: 4
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
