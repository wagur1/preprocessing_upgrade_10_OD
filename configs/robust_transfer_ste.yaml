# Stage-2 real-codec calibration for robust_transfer.yaml.
# Run after Stage 1 with the same out_dir so finetune loads its checkpoint.

device: auto
out_dir: outputs/robust_transfer
seed: 0

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  base_ch: 32
  res_scale: 1.0
  max_relative_edit: 0.25
  cond_dim: 1
  qp_ref: [20, 51]

codec:
  kind: ste
  ste_codec: both
  ste_eval_codec: h265
  ste_preset: medium
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  closed_loop: true
  step_coarse: 3.0
  step_fine: 1.0

data:
  index: data/index/kinetics_3gb.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:
  lam_task: 1.0
  omega: 0.5
  beta: 0.01
  tau: 0.1
  delta: 0.02
  gamma: 0.02
  mu: 10.0
  use_task_mask: true

train:
  epochs: 1
  max_steps: 300
  reg_warmup_frac: 0.0
  qp_per_step: 1
  batch_size: 2
  num_workers: 2
  lr: 2.0e-5
  qp_list: [22, 27, 32, 37, 42]
  qp_to_quality: {22: 5, 27: 3, 32: 2, 37: 1, 42: 1}
  cosine: true
  patience: 0
  val_max_batches: 0
  resume: false
  finetune: true

eval:
  split: test
  batch_size: 4
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
